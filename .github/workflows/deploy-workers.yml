name: Deploy to Cloudflare Workers
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate content manifest
        run: node scripts/gen-content-manifest.mjs
      - name: Build OpenNext bundle
        run: npx opennextjs-cloudflare build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Verify manifest data in bundle
        run: |
          if grep -q "codes" .open-next/server-functions/default/handler.mjs; then
            echo "HANDLER HAS MANIFEST DATA"
          else
            echo "WARNING: handler.mjs missing manifest data"
          fi
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
